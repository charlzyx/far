version: "3.1"
services:
  mysql:
    image: mysql:5.7
    container_name: mysql
    volumes:
      - ./data/db:/var/lib/mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      "MYSQL_DATABASE": "fardb"
      "MYSQL_ROOT_PASSWORD": "root"
  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"

